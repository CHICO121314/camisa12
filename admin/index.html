<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#0A1F5C;--royal:#1747C9;--soft:#E8EDFC;--bg:#F4F7FD;--card:#fff;--line:#D6DCEA;--tx:#0E1B3D;--mut:#55628A;--good:#1F7A45;--good-bg:#E3F4EA;--warn:#8A5A00;--warn-bg:#FFF4DB;--bad:#A8322A;--bad-bg:#FBE6E4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px;margin:0}
button,input,select,textarea{font:inherit}
.top{background:var(--navy);color:#fff;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:42px;height:42px}
.top h1{font-size:24px;text-transform:uppercase}
.top small{display:block;color:#C8D4F2;font-size:12px}
.top .sp{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);font-weight:600;cursor:pointer}
.btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13.5px}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
.top .btn{background:transparent;color:#fff;border-color:#3D57A8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.login{max-width:380px;margin:60px auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.login img{width:84px;margin:0 auto}
label{font-size:13px;font-weight:700;text-align:left;display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:42px;border:1px solid #C9D1E4;border-radius:9px;padding:8px 10px;background:#fff;color:var(--tx)}
textarea{min-height:64px;resize:vertical}
.msg{font-size:13.5px;color:var(--bad);min-height:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1.1;color:var(--navy)}
.kpi span{font-size:12.5px;color:var(--mut)}
.abas{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.abas button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--tx)}
.abas button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.item h3{font-size:20px}
.meta{font-size:13.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.meta a{color:var(--royal);font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--royal);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.linha2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.linha3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pac{display:flex;gap:14px;flex-wrap:wrap;padding:6px 0}
.pac label{display:flex;gap:6px;align-items:center;font-weight:600;margin:0}
.pac input{width:20px;min-height:20px}
.vazio{color:var(--mut);text-align:center;padding:24px}
.hint{font-size:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(10,15,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.modal .card{width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.modal h2{font-size:24px}
.filtro{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filtro select{width:auto;min-width:180px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.item{grid-template-columns:1fr}.acoes{justify-content:flex-start}.linha2,.linha3{grid-template-columns:1fr}}
</style>

<script>
const CFG = {"url": "", "anon": ""};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");
const ST_PED = { novo: ["Novo", "warn"], contatado: ["Contatado", ""], reuniao: ["Reunião marcada", ""], testando: ["Testando", "good"], fechou: ["Fechou", "good"], nao_quis: ["Não quis", "bad"] };
const ST_CLU = { teste: ["Em teste", "warn"], ativo: ["Ativo", "good"], suspenso: ["Suspenso", "bad"], cancelado: ["Cancelado", "bad"] };
const PLANOS = { bronze: "Bronze", prata: "Prata", ouro: "Ouro" }, PACS = { elenco: "Elenco", jogo: "Jogo", dinheiro: "Dinheiro" };
const QTD = { bronze: 1, prata: 2, ouro: 3 };
const CORES = ["marinho", "vermelho", "verde", "preto", "grena", "laranja"];
let sb = null, aba = "pedidos", filtroPed = "abertos", D = { pedidos: [], clubes: [], reuniao: null };

function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.setAttribute("role", "status"); e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); }
const hoje = () => new Date().toISOString().slice(0, 10);
const diasAte = iso => Math.round((new Date(iso + "T12:00:00") - new Date(hoje() + "T12:00:00")) / 86400000);
const dataBR = iso => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "";
const money = v => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const zap = n => { const d = String(n || "").replace(/\D/g, ""); return d ? "https:" + "/" + "/wa.me/" + (d.length <= 11 ? "55" + d : d) : ""; };
const slug = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);

async function iniciar() {
  if (!CFG || !CFG.url || !CFG.anon || !window.supabase) { app.innerHTML = `<div class="card login"><h2>Falta ligar ao Supabase</h2><p class="hint">Coloque a URL e a chave pública (anon) do projeto em <b>supabase/config.json</b> e gere o site de novo.</p></div>`; return; }
  sb = window.supabase.createClient(CFG.url, CFG.anon);
  const { data } = await sb.auth.getSession();
  if (data.session) await entrarNoPainel(); else telaLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT") telaLogin(); if (ev === "PASSWORD_RECOVERY") telaNovaSenha(); });
}

function telaNovaSenha() {
  app.innerHTML = `<form class="card login" id="f-ns" novalidate><h2>Criar senha nova</h2><div><label for="ns-s">Senha nova (mínimo 8)</label><input id="ns-s" type="password" autocomplete="new-password"></div><p class="msg" id="ns-msg" role="status"></p><button class="btn pri">Salvar senha</button></form>`;
  $("#f-ns").onsubmit = async e => { e.preventDefault(); const s = $("#ns-s").value; if (s.length < 8) { $("#ns-msg").textContent = "Use pelo menos 8 caracteres."; return; }
    const { error } = await sb.auth.updateUser({ password: s }); if (error) { $("#ns-msg").textContent = "Não deu certo. Peça outro link."; return; } toast("Senha salva"); entrarNoPainel(); };
}
async function entrarNoPainel() {
  const adm = await sb.from("admins").select("email").limit(1);
  if (adm.error || !adm.data.length) { await sb.auth.signOut(); telaLogin("Este e-mail não está na lista de administradores. Rode a última linha do 01-estrutura.sql com o seu e-mail."); return; }
  $("#sair").hidden = false; $("#sair").onclick = () => sb.auth.signOut();
  await carregar(); desenhar();
}
async function carregar() {
  const [p, c, r] = await Promise.all([
    sb.from("pedidos_demo").select("*").order("criado_em", { ascending: false }),
    sb.from("clubes").select("*").order("nome"),
    sb.from("demo_reuniao").select("*").eq("id", 1).maybeSingle(),
  ]);
  if (p.error || c.error) { toast("Não deu para carregar. Confira a internet."); return; }
  D.pedidos = p.data || []; D.clubes = c.data || []; D.reuniao = r.data;
}
function desenhar() {
  const novos = D.pedidos.filter(x => x.status === "novo").length, teste = D.clubes.filter(x => x.status === "teste").length;
  const ativos = D.clubes.filter(x => x.status === "ativo"), receita = ativos.reduce((s, x) => s + (Number(x.valor_mensal) || 0), 0);
  app.innerHTML = `<section class="kpis" aria-label="Resumo">
      <div class="kpi"><b>${novos}</b><span>pedidos novos para responder</span></div>
      <div class="kpi"><b>${teste}</b><span>clubes em teste</span></div>
      <div class="kpi"><b>${ativos.length}</b><span>clubes ativos (pagando)</span></div>
      <div class="kpi"><b>${money(receita)}</b><span>por mês, dos clubes ativos</span></div></section>
    <nav class="abas" role="tablist">${[["pedidos", "Pedidos de demonstração"], ["clubes", "Clubes"], ["reuniao", "Próxima reunião"]].map(([k, l]) => `<button role="tab" aria-selected="${aba === k}" data-aba="${k}">${l}</button>`).join("")}</nav>
    <section id="conteudo">${aba === "pedidos" ? htmlPedidos() : aba === "clubes" ? htmlClubes() : htmlReuniao()}</section>`;
  app.querySelectorAll("[data-aba]").forEach(b => b.onclick = () => { aba = b.dataset.aba; desenhar(); });
  ligar();
}
function htmlPedidos() {
  const L = D.pedidos.filter(p => filtroPed === "todos" || (filtroPed === "abertos" ? !["fechou", "nao_quis"].includes(p.status) : p.status === filtroPed));
  return `<div class="filtro"><label for="f-ped" style="margin:0">Mostrar</label><select id="f-ped"><option value="abertos">Em aberto</option><option value="todos">Todos</option>${Object.entries(ST_PED).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
    <div class="lista">${L.map(p => { const [sl, sc] = ST_PED[p.status] || [p.status, ""];
      return `<article class="card item"><div><h3>${esc(p.clube)} <span class="chip ${sc}">${sl}</span></h3>
        <div class="meta"><span>${esc(p.nome)}${p.cargo ? " · " + esc(p.cargo) : ""}</span>${p.cidade ? `<span>${esc(p.cidade)}</span>` : ""}<a href="${zap(p.whatsapp)}" target="_blank" rel="noopener">WhatsApp ${esc(p.whatsapp)}</a><span>interesse: ${esc(PLANOS[p.plano_interesse] || "ainda não sabe")}</span><span>pediu em ${dataBR(p.criado_em)}</span></div>
        <div style="margin-top:8px"><label for="po-${p.id}">Anotações</label><textarea id="po-${p.id}" data-obs="${p.id}" maxlength="1000">${esc(p.obs || "")}</textarea></div></div>
        <div class="acoes"><select aria-label="Situação do pedido" data-st="${p.id}">${Object.entries(ST_PED).map(([k, [l]]) => `<option value="${k}" ${k === p.status ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="btn sm pri" data-criar="${p.id}">Criar o clube</button></div></article>`; }).join("") || `<p class="vazio card">Nenhum pedido aqui. Os pedidos chegam pela demonstração, no botão "Quero testar no meu clube".</p>`}</div>`;
}
function htmlClubes() {
  return `<div class="filtro"><button class="btn pri" data-novo="1">＋ Cadastrar clube</button><span class="hint">Use o mesmo código que o scripts/novo_clube.py mostrou (ex.: ec-exemplo).</span></div>
    <div class="lista">${D.clubes.map(c => { const [sl, sc] = ST_CLU[c.status] || [c.status, ""];
      const d = c.teste_ate ? diasAte(c.teste_ate) : null;
      const prazo = c.status === "teste" && c.teste_ate ? `<span class="chip ${d < 0 ? "bad" : d <= 7 ? "warn" : ""}">${d < 0 ? `teste venceu há ${-d} dia(s)` : d === 0 ? "teste vence hoje" : `teste até ${dataBR(c.teste_ate)} · faltam ${d} dia(s)`}</span>` : "";
      return `<article class="card item"><div><h3>${esc(c.nome)} <span class="chip ${sc}">${sl}</span> ${prazo}</h3>
        <div class="meta"><span>código ${esc(c.codigo)}</span><span>${esc(PLANOS[c.plano])}: ${(c.pacotes || []).map(x => PACS[x] || x).join(", ")}</span>${c.cidade ? `<span>${esc(c.cidade)}</span>` : ""}${c.responsavel ? `<span>${esc(c.responsavel)}</span>` : ""}${c.whatsapp ? `<a href="${zap(c.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}${c.valor_mensal ? `<span>${money(c.valor_mensal)}/mês</span>` : ""}${c.link ? `<a href="${esc(c.link)}" target="_blank" rel="noopener">Abrir a plataforma do clube</a>` : ""}</div></div>
        <div class="acoes">${c.status !== "ativo" ? `<button class="btn sm good" data-sit="${c.id}:ativo">Liberar (ativo)</button>` : ""}${c.status !== "suspenso" ? `<button class="btn sm bad" data-sit="${c.id}:suspenso">Suspender</button>` : ""}<button class="btn sm" data-edit="${c.id}">Editar</button></div></article>`; }).join("") || `<p class="vazio card">Nenhum clube ainda. Cadastre aqui depois de montar a cópia do clube (docs/MONTAR-CLUBE.md).</p>`}</div>`;
}
function htmlReuniao() {
  const r = D.reuniao || {};
  return `<form class="card" id="f-reu" novalidate style="display:flex;flex-direction:column;gap:10px;max-width:640px">
    <h2>Clube da demonstração na próxima reunião</h2>
    <p class="hint">A demonstração mostra o nome, a cidade e as cores do clube de quem vai assistir. Os atletas e os números continuam inventados. É o mesmo que rodar o 02-reuniao.sql no SQL Editor.</p>
    <div class="linha2"><div><label for="r-nome">Nome curto do clube</label><input id="r-nome" maxlength="24" value="${esc(r.clube_nome || "")}"></div><div><label for="r-comp">Nome completo</label><input id="r-comp" maxlength="80" value="${esc(r.clube_completo || "")}"></div></div>
    <div class="linha3"><div><label for="r-cid">Cidade</label><input id="r-cid" maxlength="60" value="${esc(r.cidade || "")}"></div><div><label for="r-cor">Cores</label><select id="r-cor">${CORES.map(c => `<option ${c === r.cores ? "selected" : ""}>${c}</option>`).join("")}</select></div><div><label for="r-pres">Quem vai assistir</label><input id="r-pres" maxlength="40" value="${esc(r.presidente || "")}" placeholder="Ex.: Carlos"></div></div>
    <div class="acoes" style="justify-content:flex-start"><button class="btn pri" type="submit">Preparar a demonstração</button><button class="btn" type="button" id="r-padrao">Voltar ao EC Exemplo</button><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="../demo/" target="_blank" rel="noopener">Abrir a demonstração</a></div></form>`;
}
function ligar() {
  const fp = $("#f-ped"); if (fp) { fp.value = filtroPed; fp.onchange = () => { filtroPed = fp.value; desenhar(); }; }
  app.querySelectorAll("[data-st]").forEach(s => s.onchange = () => salvar("pedidos_demo", s.dataset.st, { status: s.value }, "Situação salva"));
  app.querySelectorAll("[data-obs]").forEach(t => t.onblur = () => { const p = D.pedidos.find(x => x.id === t.dataset.obs); if (p && (p.obs || "") !== t.value) salvar("pedidos_demo", p.id, { obs: t.value }, "Anotação salva", true); });
  app.querySelectorAll("[data-criar]").forEach(b => b.onclick = () => { const p = D.pedidos.find(x => x.id === b.dataset.criar); formClube({ nome: p.clube, cidade: p.cidade, responsavel: p.nome + (p.cargo ? " (" + p.cargo + ")" : ""), whatsapp: p.whatsapp, plano: p.plano_interesse && p.plano_interesse !== "nao_sei" ? p.plano_interesse : "ouro", pedido_id: p.id }); });
  app.querySelectorAll("[data-novo]").forEach(b => b.onclick = () => formClube({}));
  app.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => formClube(D.clubes.find(x => x.id === b.dataset.edit)));
  app.querySelectorAll("[data-sit]").forEach(b => b.onclick = () => { const [id, st] = b.dataset.sit.split(":"); salvar("clubes", id, { status: st }, st === "ativo" ? "Clube liberado. A plataforma dele atualiza em até 5 minutos." : "Clube suspenso. A plataforma dele avisa em até 5 minutos."); });
  const fr = $("#f-reu"); if (fr) {
    fr.onsubmit = async e => { e.preventDefault(); const nome = $("#r-nome").value.trim(); if (!nome) { toast("Escreva o nome do clube"); return; }
      await salvarReuniao({ clube_nome: nome, clube_completo: $("#r-comp").value.trim() || nome, cidade: $("#r-cid").value.trim() || "Sertãozinho", cores: $("#r-cor").value, presidente: $("#r-pres").value.trim() || null, reuniao_em: new Date().toISOString() }, "Demonstração preparada para " + nome); };
    $("#r-padrao").onclick = () => salvarReuniao({ clube_nome: "EC Exemplo", clube_completo: "Esporte Clube Exemplo", cidade: "Sertãozinho", cores: "marinho", presidente: null, reuniao_em: null }, "Demonstração voltou ao EC Exemplo");
  }
}
async function salvar(tab, id, campos, msg, quieto) {
  const { error } = await sb.from(tab).update(campos).eq("id", id);
  if (error) { toast("Não salvou: " + error.message); return; }
  if (msg) toast(msg);
  await carregar(); if (!quieto) desenhar();
}
async function salvarReuniao(campos, msg) {
  const { error } = await sb.from("demo_reuniao").update(campos).eq("id", 1);
  if (error) { toast("Não salvou: " + error.message); return; }
  toast(msg); await carregar(); desenhar();
}
function formClube(c) {
  const novo = !c.id, plano = c.plano || "ouro", pac = c.pacotes || (plano === "ouro" ? ["elenco", "jogo", "dinheiro"] : []);
  const ate = c.teste_ate || new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10);
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-label", novo ? "Cadastrar clube" : "Editar clube");
  m.innerHTML = `<form class="card" id="f-clu" novalidate><h2>${novo ? "Cadastrar clube" : "Editar " + esc(c.nome)}</h2>
    <div class="linha2"><div><label for="c-nome">Nome do clube</label><input id="c-nome" maxlength="80" value="${esc(c.nome || "")}"></div><div><label for="c-cod">Código</label><input id="c-cod" maxlength="40" value="${esc(c.codigo || slug(c.nome))}" ${novo ? "" : "readonly"}></div></div>
    <div class="linha3"><div><label for="c-cid">Cidade</label><input id="c-cid" value="${esc(c.cidade || "")}"></div><div><label for="c-resp">Responsável</label><input id="c-resp" value="${esc(c.responsavel || "")}"></div><div><label for="c-zap">WhatsApp</label><input id="c-zap" inputmode="tel" value="${esc(c.whatsapp || "")}"></div></div>
    <div class="linha3"><div><label for="c-plano">Plano</label><select id="c-plano">${Object.entries(PLANOS).map(([k, l]) => `<option value="${k}" ${k === plano ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div><label for="c-st">Situação</label><select id="c-st">${Object.entries(ST_CLU).map(([k, [l]]) => `<option value="${k}" ${k === (c.status || "teste") ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div><label for="c-ate">Teste até</label><input id="c-ate" type="date" value="${esc(ate)}"></div></div>
    <fieldset style="border:0;padding:0;margin:0"><legend style="font-size:13px;font-weight:700">Pacotes</legend><div class="pac">${Object.entries(PACS).map(([k, l]) => `<label><input type="checkbox" value="${k}" ${pac.includes(k) ? "checked" : ""}> ${l}</label>`).join("")}</div><p class="hint" id="c-pac-dica"></p></fieldset>
    <div class="linha2"><div><label for="c-link">Link da plataforma do clube (termina em /exec)</label><input id="c-link" value="${esc(c.link || "")}"></div><div><label for="c-val">Valor por mês (R$)</label><input id="c-val" inputmode="decimal" value="${esc(c.valor_mensal || "")}"></div></div>
    <div><label for="c-obs">Anotações</label><textarea id="c-obs">${esc(c.obs || "")}</textarea></div>
    <p class="msg" id="c-msg" role="status"></p>
    <div class="acoes"><button class="btn" type="button" id="c-cancel">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`;
  document.body.appendChild(m);
  const f = m.querySelector("#f-clu"), dica = () => { const p = f.querySelector("#c-plano").value; f.querySelector("#c-pac-dica").textContent = p === "ouro" ? "O Ouro tem todos os pacotes." : `O ${PLANOS[p]} tem ${QTD[p]} pacote(s).`; if (p === "ouro") f.querySelectorAll(".pac input").forEach(i => i.checked = true); };
  dica(); f.querySelector("#c-plano").onchange = dica;
  if (novo) f.querySelector("#c-nome").oninput = e => { f.querySelector("#c-cod").value = slug(e.target.value); };
  const fechar = () => m.remove();
  f.querySelector("#c-cancel").onclick = fechar; m.onclick = e => { if (e.target === m) fechar(); };
  document.addEventListener("keydown", function esc1(e) { if (e.key === "Escape") { fechar(); document.removeEventListener("keydown", esc1); } });
  f.onsubmit = async e => {
    e.preventDefault();
    const g = id => f.querySelector(id).value.trim(), plano = g("#c-plano"), pacotes = [...f.querySelectorAll(".pac input:checked")].map(i => i.value);
    const msg = f.querySelector("#c-msg");
    if (!g("#c-nome")) { msg.textContent = "Escreva o nome do clube."; return; }
    if (!/^[a-z0-9-]{3,40}$/.test(g("#c-cod"))) { msg.textContent = "O código usa só letras minúsculas, números e hífen (ex.: ec-exemplo)."; return; }
    if (pacotes.length !== QTD[plano]) { msg.textContent = `O plano ${PLANOS[plano]} tem ${QTD[plano]} pacote(s): marque ${QTD[plano]}.`; return; }
    const dados = { nome: g("#c-nome"), cidade: g("#c-cid") || null, responsavel: g("#c-resp") || null, whatsapp: g("#c-zap") || null, plano, pacotes, status: g("#c-st"),
      teste_ate: g("#c-ate") || null, link: g("#c-link") || null, valor_mensal: g("#c-val") ? Number(g("#c-val").replace(/\./g, "").replace(",", ".")) || null : null, obs: g("#c-obs") || null };
    let r;
    if (novo) { dados.codigo = g("#c-cod"); if (c.pedido_id) dados.pedido_id = c.pedido_id; r = await sb.from("clubes").insert(dados); }
    else r = await sb.from("clubes").update(dados).eq("id", c.id);
    if (r.error) { msg.textContent = /duplicate|unique/i.test(r.error.message) ? "Já existe um clube com esse código." : "Não salvou: " + r.error.message; return; }
    if (novo && c.pedido_id) await sb.from("pedidos_demo").update({ status: "testando" }).eq("id", c.pedido_id);
    fechar(); toast(novo ? "Clube cadastrado" : "Clube salvo"); aba = "clubes"; await carregar(); desenhar();
  };
  f.querySelector("#c-nome").focus();
}
iniciar();
</script>
